name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run dependency-free core tests
        run: python -m unittest discover -s tests -v

  astrbot-runtime-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install AstrBot and default plugin dependency
        run: python -m pip install "AstrBot==4.27.1" -r requirements.txt
      - name: Import plugin against the supported AstrBot runtime
        env:
          PYTHONPATH: ${{ github.workspace }}/..
        run: |
          python -c "import astrbot_plugin_mr_memory.main"
          python -c "from astrbot.core.agent.runners.tool_loop_agent_runner import ToolLoopAgentRunner; assert callable(ToolLoopAgentRunner.step)"
